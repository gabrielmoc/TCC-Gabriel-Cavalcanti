<svg width="1200" height="690" viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Case 2: Catalog - baseline versus Redis</title>
  <desc id="desc">Comparação de latência média, p95 e throughput sob carga moderada e forte. Valores agregados de três repetições por cenário.</desc>
  <rect width="1200" height="690" fill="#f7f5ef"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17232e">Case 2 - Endpoint de catálogo</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" fill="#52616d">Baseline versus Redis | dataset: 1.500 itens e 240 usuários | média de 3 repetições</text>
  <rect x="60" y="126" width="1080" height="2" fill="#d8d2c7"/>

  <text x="60" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17232e">Carga moderada: baseline apresentou melhor desempenho</text>
  <g font-family="Arial, sans-serif">
    <text x="60" y="210" font-size="15" fill="#52616d">Latência média (ms) - menor é melhor</text>
    <rect x="60" y="224" width="569" height="25" rx="5" fill="#d96841"/><text x="639" y="244" font-size="15" font-weight="700" fill="#17232e">Baseline: 71,11</text>
    <rect x="60" y="259" width="698" height="25" rx="5" fill="#258468"/><text x="768" y="279" font-size="15" font-weight="700" fill="#17232e">Redis: 87,23</text>
    <text x="60" y="322" font-size="15" fill="#52616d">Latência p95 (ms) - menor é melhor</text>
    <rect x="60" y="336" width="557" height="25" rx="5" fill="#d96841"/><text x="627" y="356" font-size="15" font-weight="700" fill="#17232e">Baseline: 139,30</text>
    <rect x="60" y="371" width="677" height="25" rx="5" fill="#258468"/><text x="747" y="391" font-size="15" font-weight="700" fill="#17232e">Redis: 169,17</text>
    <text x="60" y="434" font-size="15" fill="#52616d">Throughput (req/s) - maior é melhor</text>
    <rect x="60" y="448" width="670" height="25" rx="5" fill="#d96841"/><text x="740" y="468" font-size="15" font-weight="700" fill="#17232e">Baseline: 167,46</text>
    <rect x="60" y="483" width="622" height="25" rx="5" fill="#258468"/><text x="692" y="503" font-size="15" font-weight="700" fill="#17232e">Redis: 155,60</text>
  </g>

  <rect x="60" y="542" width="1080" height="2" fill="#d8d2c7"/>
  <text x="60" y="586" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17232e">Carga forte: a regressão permaneceu com Redis</text>
  <text x="60" y="620" font-family="Arial, sans-serif" font-size="16" fill="#52616d">Latência média: 305,78 ms (baseline) para 342,64 ms (Redis) | p95: 490,39 ms para 588,68 ms | throughput: 174,64 para 158,54 req/s.</text>
  <text x="60" y="654" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8a3d2e">Taxa de erro: 0 nos dois cenários e nos dois perfis de carga.</text>
</svg>
