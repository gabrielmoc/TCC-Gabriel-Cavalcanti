<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de preparação e execução da matriz experimental</title>
  <desc id="description">Diagrama com as etapas de preparação dos serviços, seleção do cenário, preparação da fonte de dados, aquecimento, validação, execução do k6, coleta de métricas e consolidação dos resultados.</desc>
  <defs>
    <style>
      .subtitle { font-family: Arial, sans-serif; font-size: 20px; fill: #000000; }
      .step { font-family: Arial, sans-serif; font-size: 18px; fill: #000000; }
      .detail { font-family: Arial, sans-serif; font-size: 15px; fill: #000000; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="subtitle">Protocolo repetido para cada combinação entre cenário tecnológico e perfil de carga</text>

  <path class="arrow" d="M390 186 H455"/>
  <path class="arrow" d="M785 186 H850"/>
  <path class="arrow" d="M1180 186 H1245"/>
  <path class="arrow" d="M1365 256 V340 H275 V385"/>
  <path class="arrow" d="M550 455 H615"/>
  <path class="arrow" d="M945 455 H1010"/>
  <path class="arrow" d="M1340 455 H1405"/>

  <g transform="translate(115 116)">
    <rect width="275" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="137" y="48" text-anchor="middle" class="step">Preparar serviços</text>
    <text x="137" y="80" text-anchor="middle" class="detail">Portas isoladas e</text>
    <text x="137" y="103" text-anchor="middle" class="detail">endereços verificados.</text>
  </g>

  <g transform="translate(455 116)">
    <rect width="330" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="165" y="48" text-anchor="middle" class="step">Selecionar cenário</text>
    <text x="165" y="80" text-anchor="middle" class="detail">Baseline, Redis ou Solr.</text>
    <text x="165" y="103" text-anchor="middle" class="detail">Contrato e dataset constantes.</text>
  </g>

  <g transform="translate(850 116)">
    <rect width="330" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="165" y="48" text-anchor="middle" class="step">Preparar fonte de dados</text>
    <text x="165" y="80" text-anchor="middle" class="detail">Aquecer Redis ou reindexar</text>
    <text x="165" y="103" text-anchor="middle" class="detail">catálogo determinístico no Solr.</text>
  </g>

  <g transform="translate(1245 116)">
    <rect width="280" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="140" y="48" text-anchor="middle" class="step">Validar contrato</text>
    <text x="140" y="80" text-anchor="middle" class="detail">Testes de fumaça, conteúdo,</text>
    <text x="140" y="103" text-anchor="middle" class="detail">ordem e formato do payload.</text>
  </g>

  <g transform="translate(75 385)">
    <rect width="475" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="237" y="48" text-anchor="middle" class="step">Executar carga com k6</text>
    <text x="237" y="80" text-anchor="middle" class="detail">Aplicar o Case 1, 2 ou 3 pelo endpoint</text>
    <text x="237" y="103" text-anchor="middle" class="detail">de recomendações; três repetições por combinação.</text>
  </g>

  <g transform="translate(615 385)">
    <rect width="330" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="165" y="48" text-anchor="middle" class="step">Coletar evidências</text>
    <text x="165" y="80" text-anchor="middle" class="detail">Latência, p95, vazão, erros,</text>
    <text x="165" y="103" text-anchor="middle" class="detail">logs, CPU e memória RSS.</text>
  </g>

  <g transform="translate(1010 385)">
    <rect width="330" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="165" y="48" text-anchor="middle" class="step">Verificar validade</text>
    <text x="165" y="80" text-anchor="middle" class="detail">Contrato, arquivos de saída e</text>
    <text x="165" y="103" text-anchor="middle" class="detail">limiares técnicos da rodada.</text>
  </g>

  <g transform="translate(1405 385)">
    <rect width="120" height="140" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="60" y="59" text-anchor="middle" class="step">Salvar e</text>
    <text x="60" y="87" text-anchor="middle" class="step">agregar</text>
  </g>

</svg>
